name: FitMeal

services:
  fitmeal-db:
    image: mysql:8.0
    container_name: FitMeal
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: FitMealRoot123
      MYSQL_DATABASE: fitness_platform
      MYSQL_USER: fitmeal_user
      MYSQL_PASSWORD: FitMeal123
    ports:
      - "3307:3306"
    volumes:
      - fitmeal-data:/var/lib/mysql
    networks:
      - fitmeal-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  fitmeal-nginx:
    image: nginx:alpine
    container_name: fitmeal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./compartido/exercises:/usr/share/nginx/exercises:ro
    depends_on:
      - fitmeal-api
    networks:
      - fitmeal-network

  fitmeal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitmeal-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      DB_HOST: fitmeal-db
      DB_PORT: 3306
      NODE_ENV: production
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      fitmeal-db:
        condition: service_healthy
    networks:
      - fitmeal-network

  fitmeal-phpmyadmin:
    image: phpmyadmin:latest
    container_name: fitmeal-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: fitmeal-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: FitMealRoot123
    ports:
      - "8081:80"
    depends_on:
      - fitmeal-db
    networks:
      - fitmeal-network

volumes:
  fitmeal-data:
    driver: local

networks:
  fitmeal-network:
    driver: bridge
